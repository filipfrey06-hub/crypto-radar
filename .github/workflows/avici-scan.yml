name: AVICI Scan — cena, MetaDAO, newsy

on:
  schedule:
    # Co godzinę, 24/7
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (nie wysyłaj alertów)'
        required: false
        default: 'false'

jobs:
  avici-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download state DB
        uses: actions/download-artifact@v4
        with:
          name: state-db
          path: data/
        continue-on-error: true

      - name: Run AVICI scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AVICI_TELEGRAM_CHAT_ID: ${{ secrets.AVICI_TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/avici_scan.py

      - name: Upload state DB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-db
          path: data/state.db
          retention-days: 7
          overwrite: true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-logs-avici
          path: logs/
          retention-days: 3
          overwrite: true
