name: Fast Scan — nowe tokeny Solana

on:
  schedule:
    # Co 30 minut, 24/7
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (nie wysyłaj alertów)'
        required: false
        default: 'false'

jobs:
  fast-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download state DB (artefakt z poprzedniego runu)
        uses: actions/download-artifact@v4
        with:
          name: state-db
          path: data/
        continue-on-error: true  # pierwszy run nie ma artefaktu

      - name: Run fast scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/fast_scan.py

      - name: Upload state DB (zachowaj na następny run)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-db
          path: data/state.db
          retention-days: 7
          overwrite: true

      - name: Upload scan logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-logs-fast
          path: logs/
          retention-days: 3
          overwrite: true
