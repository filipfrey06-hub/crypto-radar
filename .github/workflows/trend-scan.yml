name: Trend Scan — wczesne wykrywanie narracji

on:
  schedule:
    # Co 6 godzin: 0:00, 6:00, 12:00, 18:00
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (nie wysyłaj alertów)'
        required: false
        default: 'false'

jobs:
  trend-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download state DB
        uses: actions/download-artifact@v4
        with:
          name: state-db
          path: data/
        continue-on-error: true

      - name: Run trend scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TREND_TELEGRAM_BOT_TOKEN: ${{ secrets.TREND_TELEGRAM_BOT_TOKEN }}
          TREND_TELEGRAM_CHAT_ID: ${{ secrets.TREND_TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/trend_scan.py

      - name: Upload state DB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-db
          path: data/state.db
          retention-days: 7
          overwrite: true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-logs-trend
          path: logs/
          retention-days: 3
          overwrite: true
